<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template Form</title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7fc;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Container to center content */
    .container {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    /* Heading Styles */
    h1 {
      font-size: 2rem;
      color: #122030;
      margin-bottom: 20px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    label {
      font-size: 1rem;
      margin-bottom: 8px;
      color: #122030;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin: 0;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #122030;
      box-shadow: 0 0 5px rgba(18, 32, 48, 0.5);
    }

    textarea {
      resize: vertical;
      min-height: 150px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background-color: #122030;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0f1c36;
    }

    /* Checkbox Styling */
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px; /* Added gap between the label and the checkbox */
    }

    .checkbox-group input[type="checkbox"] {
      width: auto;
      height: 18px;
      accent-color: #122030; /* Modern styling for checkboxes */
    }

    /* Mobile Responsiveness */
    @media (max-width: 480px) {
      .container {
        width: 90%;
        padding: 15px;
      }

      h1 {
        font-size: 1.5rem;
      }

      form input, form select, form textarea {
        font-size: 0.9rem;
      }

      button {
        font-size: 0.9rem;
        padding: 10px;
      }
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>Template Form</h1>
    <form>
      
      <!-- Description Field -->
      <div class="form-group">
        <label for="description">Add Template</label>
        <textarea id="description" name="description" placeholder="Enter the template description..." required></textarea>
      </div>

      <!-- Template Type Field -->
      <div class="form-group">
        <label for="templateType">Template Type:</label>
        <select id="templateType" name="templateType" required>
          <option value="">Select Template Type</option>
          <option value="sandgrid">Sandgrid</option>
          <option value="twilio">Twilio</option>
        </select>
      </div>

      <!-- isOrder Field (Checkbox with Label on Left) -->
      <div class="form-group checkbox-group">
        <input type="checkbox" id="isOrder" name="isOrder" value="true">Is_Order</input>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submit">Submit</button>
    </form>
  </div>
  <script src="./js/template.js">
  </script>
</body>
</html>
